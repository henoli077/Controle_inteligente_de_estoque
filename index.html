<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de estoque inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</html>
<body>
    <center>
        <header class="header-app">
            <h1>
                <b>
                    CONTROLE DE ESTOQUE
                </b>
            </h1>
        </header>
        <div class="main-card">
            <div>
                <div>
                    <label>Nome</label>
                    <div>
                        <input type="text" id="nome" placeholder="Ex: ">
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label>Categoria</label>
                    <div>
                        <input type="text" id="categoria" placeholder="Ex: ">
                    </div>
                </div>
            </div>
            <div>
                <label>Quantidade em estoque</label>
                <div>
                    <input type="number" id="qtd" placeholder="0">
                </div>
            </div>
            <div>
                <label>Estoque mínimo desejado</label>
                <div>
                    <input type="number" id="qtdMin" placeholder="0">
                </div>
            </div>
            <div>
                <label>Preço unitário</label>
                <div>
                    <input type="number" id="valor" placeholder="0.00">
                </div>
            </div>
            <div>
                <button onclick="adicionaDados()" class="btn-add">
                    Adicionar
                </button>
                <button onclick="botaoCancelar()" class="btn-clear">
                    Limpar
                </button>
                <button onclick="deletaLista()" class="btn-delete-all">
                    Deletar Lista
                </button>
            </div>
            <div>
                <table id="listaTab">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>nome</th>
                            <th>categoria</th>
                            <th>Qtd.</th>
                            <th>Status</th>
                            <th>Preço Unit.</th>
                            <th>Valor total em estoque</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="5">
                                Nenhum item na lista
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="total-produtos-container">
                Total de produtos cadastrados: <span>0</span>
            </div>
            <div id="produtos-sem-estoque-container">
                Produtos sem estoque: <span>0</span>
            </div>
            <div id="produtos-estoque-critico-container">
                Produtos com estoque crítico: <span>0</span>
            </div>
            <div id="total-container">
                Valor total em estoque: <span>R$ 0,00</span>
            </div>
        </div>
    </center>
    <script src="script/script.js"></script>
</body>
